[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-weather"
version = "1.3.0"
description = "Black Diamond Hub app: weather for any location (now, 24 hours, 7 days, air quality)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.15,<1",
    "requests",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-weather"

[project.entry-points."blackdiamondhub.plugins"]
weather = "weather.plugin:spec"

[tool.setuptools.packages.find]
include = ["weather", "weather.*"]

[tool.setuptools.package-data]
weather = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
